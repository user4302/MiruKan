name: Build & Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # FIX 1: Moved up here so VERSION_TAG is available for ALL steps below
      - name: Get version name
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION_TAG=${GITHUB_REF#refs/tags/}
          else
            VERSION_TAG="v1.0.0-${GITHUB_SHA::7}"
          fi
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > ${{ runner.temp }}/keystore.jks

      - name: Build app
        env:
          SIGNING_KEY_FILE: ${{ runner.temp }}/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -Penable-updater

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      # FIX 2: Swapped the order so we rename the files FIRST before any archiving happens
      - name: Clean up and calculate checksums
        if: github.repository == 'user4302/MiruKan'
        run: |
          set -e
          cd app/build/outputs/apk/release/

          mv app-universal-release.apk mirukan-universal-${{ env.VERSION_TAG }}.apk
          echo "APK_UNIVERSAL_SHA=$(sha256sum mirukan-universal-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }')" >> $GITHUB_ENV

          mv app-arm64-v8a-release.apk mirukan-arm64-v8a-${{ env.VERSION_TAG }}.apk
          echo "APK_ARM64_V8A_SHA=$(sha256sum mirukan-arm64-v8a-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }')" >> $GITHUB_ENV

          mv app-armeabi-v7a-release.apk mirukan-armeabi-v7a-${{ env.VERSION_TAG }}.apk
          echo "APK_ARMEABI_V7A_SHA=$(sha256sum mirukan-armeabi-v7a-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }')" >> $GITHUB_ENV

          mv app-x86-release.apk mirukan-x86-${{ env.VERSION_TAG }}.apk
          echo "APK_X86_SHA=$(sha256sum mirukan-x86-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }')" >> $GITHUB_ENV

          mv app-x86_64-release.apk mirukan-x86_64-${{ env.VERSION_TAG }}.apk
          echo "APK_X86_64_SHA=$(sha256sum mirukan-x86_64-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }')" >> $GITHUB_ENV

      # FIX 3: Point path to collect files cleanly whether they were renamed or not
      - name: Upload All Release APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MiruKan-APKs-${{ env.VERSION_TAG }}
          path: app/build/outputs/apk/release/*.apk

      - name: Upload mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapping-${{ env.VERSION_TAG }}
          path: app/build/outputs/mapping/release

      - name: Create Release
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && github.repository == 'user4302/MiruKan'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: MiruKan ${{ env.VERSION_TAG }}
          generate_release_notes: true
          body: |
            ---

            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | Universal | ${{ env.APK_UNIVERSAL_SHA }} |
            | arm64-v8a | ${{ env.APK_ARM64_V8A_SHA }} |
            | armeabi-v7a | ${{ env.APK_ARMEABI_V7A_SHA }} |
            | x86 | ${{ env.APK_X86_SHA }} |
            | x86_64 | ${{ env.APK_X86_64_SHA }} |
          files: |
            app/build/outputs/apk/release/mirukan-${{ env.VERSION_TAG }}.apk
            app/build/outputs/apk/release/mirukan-arm64-v8a-${{ env.VERSION_TAG }}.apk
            app/build/outputs/apk/release/mirukan-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            app/build/outputs/apk/release/mirukan-x86-${{ env.VERSION_TAG }}.apk
            app/build/outputs/apk/release/mirukan-x86_64-${{ env.VERSION_TAG }}.apk
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
