name: Build & Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get version name
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION_TAG=${GITHUB_REF#refs/tags/}
            IS_RELEASE="true"
          else
            VERSION_TAG="v1.0.0-${GITHUB_SHA::7}"
            IS_RELEASE="false"
          fi
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          echo "IS_RELEASE=$IS_RELEASE" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > ${{ runner.temp }}/keystore.jks

      - name: Build app
        env:
          SIGNING_KEY_FILE: ${{ runner.temp }}/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ env.IS_RELEASE }}" = "true" ]; then
            echo "Official tag release: Compiling all split architectures..."
            ./gradlew assembleRelease -Penable-updater --build-cache --parallel --configure-on-demand
          else
            echo "Manual check/dev push: Compiling only the Universal package..."
            ./gradlew assembleReleaseUniversal -Penable-updater --build-cache --parallel --configure-on-demand
          fi

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Clean up and calculate checksums
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && github.repository == 'user4302/MiruKan'
        run: |
          set -e
          cd app/build/outputs/apk/release/

          # Function to safely process files only if Gradle outputted them
          process_apk() {
            local src=$1
            local dest=$2
            local env_var=$3
            if [ -f "$src" ]; then
              mv "$src" "$dest"
              echo "$env_var=$(sha256sum $dest | awk '{ print $1 }')" >> $GITHUB_ENV
            else
              echo "$src not found, skipping."
              echo "$env_var=Skipped (Development Build)" >> $GITHUB_ENV
            fi
          }

          process_apk "app-universal-release.apk" "mirukan-${{ env.VERSION_TAG }}-universal.apk" "APK_UNIVERSAL_SHA"
          process_apk "app-arm64-v8a-release.apk" "mirukan-${{ env.VERSION_TAG }}-arm64-v8a.apk" "APK_ARM64_V8A_SHA"
          process_apk "app-armeabi-v7a-release.apk" "mirukan-${{ env.VERSION_TAG }}-armeabi-v7a.apk" "APK_ARMEABI_V7A_SHA"
          process_apk "app-x86-release.apk" "mirukan-${{ env.VERSION_TAG }}-x86.apk" "APK_X86_SHA"
          process_apk "app-x86_64-release.apk" "mirukan-${{ env.VERSION_TAG }}-x86_64.apk" "APK_X86_64_SHA"

      - name: Upload All Release APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MiruKan-APKs-${{ env.VERSION_TAG }}
          path: app/build/outputs/apk/release/*.apk

      - name: Upload mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapping-${{ env.VERSION_TAG }}
          path: app/build/outputs/mapping/release

      - name: Create Release
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && github.repository == 'user4302/MiruKan'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: MiruKan ${{ env.VERSION_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ---

            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | Universal | ${{ env.APK_UNIVERSAL_SHA }} |
            | arm64-v8a | ${{ env.APK_ARM64_V8A_SHA }} |
            | armeabi-v7a | ${{ env.APK_ARMEABI_V7A_SHA }} |
            | x86 | ${{ env.APK_X86_SHA }} |
            | x86_64 | ${{ env.APK_X86_64_SHA }} |
          files: |
            app/build/outputs/apk/release/mirukan-${{ env.VERSION_TAG }}-universal.apk
            app/build/outputs/apk/release/mirukan-${{ env.VERSION_TAG }}-arm64-v8a.apk
            app/build/outputs/apk/release/mirukan-${{ env.VERSION_TAG }}-armeabi-v7a.apk
            app/build/outputs/apk/release/mirukan-${{ env.VERSION_TAG }}-x86.apk
            app/build/outputs/apk/release/mirukan-${{ env.VERSION_TAG }}-x86_64.apk
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
